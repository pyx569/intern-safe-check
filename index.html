<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实习有约 | 大学生实习风险体检</title>
    <script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #ffffff;
            padding: 40px 20px;
            color:#333;
        }
        .container{
            max-width:1100px;
            margin:0 auto;
        }
        .header-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }
        .btn{
            padding:8px 16px;
            border-radius:6px;
            border:none;
            cursor:pointer;
            font-size:14px;
        }
        .btn-primary{
            background:#1677ff;
            color:#fff;
        }
        .btn-warning{
            background:#faad14;
            color:#fff;
        }
        .btn-danger{
            background:#ff4d4f;
            color:#fff;
        }
        .btn-success{
            background:#52c41a;
            color:#fff;
        }
        .section{
            margin-bottom:32px;
            border:1px solid #eee;
            border-radius:10px;
            padding:24px;
        }
        .section-title{
            font-size:18px;
            font-weight:bold;
            margin-bottom:16px;
        }
        textarea,input{
            width:100%;
            border:1px solid #d9d9d9;
            border-radius:6px;
            padding:10px;
            font-size:14px;
        }
        .card-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill,minmax(240px,1fr));
            gap:16px;
            margin-top:16px;
        }
        .c-card{
            border-radius:8px;
            padding:14px;
            border:1px solid #ddd;
            cursor:pointer;
        }
        .status-clear{background:#fff;border-color:#ccc;}
        .status-pending{background:#fffbe6;border-color:#ffe58f;}
        .status-confirm{background:#f6ffed;border-color:#b7eb8f;}
        .status-na{background:#f5f5f5;border-color:#d9d9d9;color:#666;}
        .result-block{
            padding:20px;
            border-radius:8px;
            margin:20px 0;
            white-space: pre-line;
        }
        .red {
          background: #fff1f0;
          border: 1px solid #ff4d4f;
          color: #cf1322;
        }
        .yellow {
          background: #fffbe6;
          border: 1px solid #faad14;
          color: #d48806;
        }
        .green {
          background: #f6ffed;
          border: 1px solid #52c41a;
          color: #389e0d;
        }
        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.4);
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .modal-box{
            background:#fff;
            padding:24px;
            border-radius:10px;
            width:90%;
            max-width:520px;
        }
        .report-hidden{
            display:none;
        }
        .h-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:14px 0;
            border-bottom:1px solid #eee;
            gap:20px;
        }
        .h-text{
            flex:1;
            line-height:1.6;
        }
        .h-radio-group{
            flex-shrink:0;
            white-space:nowrap;
            display:flex;
            gap:14px;
            align-items:center;
        }
        .h-radio-group label{
            display:flex;
            align-items:center;
            gap:4px;
            cursor:pointer;
        }
        .h-radio-group input[type="radio"]{
            width:auto;
            margin:0;
        }
        .input-row{
            display:flex;
            gap:16px;
            flex-wrap:wrap;
            align-items:center;
            margin-top:10px;
        }
        .input-item{
            flex:1;
            min-width:200px;
        }
        .expand-wrap{
            margin-top:20px;
        }
        .expand-btn-area{
            text-align:center;
            margin-top:18px;
        }
        .expand-content{
            display:none;
            margin-top:16px;
        }
        .expand-content.show{
            display:block;
        }
        .no-print{}
        @media print{
            .no-print{display:none !important;}
            body{padding:0; background:#fff;}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar no-print">
        <h1>实习有约｜大学生实习风险体检</h1>
        <div>
            <a href="intern.html"><button class="btn">我的工作台</button></a>
            <a href="fill.html"><button class="btn btn-primary">快捷录入</button></a>
        </div>
    </div>

    <div class="section no-print">
        <div class="section-title">第一步：填写/识别岗位招聘信息</div>
        <textarea id="jobText" rows="6" placeholder="粘贴岗位描述，或者上传截图自动识别"></textarea>
        <div style="margin:12px 0;">
            <input type="file" id="ocrFile" accept="image/*">
            <button class="btn btn-warning" id="ocrBtn">开始识图提取文字</button>
            <span id="ocrTip"></span>
        </div>
        <div class="input-row">
            <div class="input-item">
                <label>单位全称：</label>
                <input id="companyName" placeholder="填写企业完整名称">
            </div>
            <div class="input-item">
                <label>岗位名称：</label>
                <input id="postName" placeholder="填写实习岗位">
            </div>
            <div style="margin-top:22px">
                <button class="btn btn-primary" id="checkCompanyBtn">一键工商核验</button>
            </div>
        </div>
    </div>

    <div class="section no-print">
        <div class="section-title">第二步：17项实习风险人工核验</div>
        <div id="hList"></div>
    </div>

    <div class="section no-print">
        <div class="section-title">第三步：实习约定信息核验卡片（点击卡片编辑详情）</div>
        <div id="coreCardWrap" class="card-grid"></div>
        <div class="expand-btn-area no-print">
            <button class="btn" id="toggleExpandBtn">展开拓展约定项</button>
        </div>
        <div class="expand-content" id="expandPanel">
            <p style="margin:12px 0;color:#666;">拓展补充约定（可选核验项）</p>
            <div id="expandCardWrap" class="card-grid"></div>
        </div>
    </div>

    <div style="text-align:center;margin:20px 0;" class="no-print">
        <button class="btn btn-success" id="calcResultBtn">生成风险评估报告</button>
    </div>
    <div id="resultWrap" class="no-print"></div>

    <div id="reportArea" class="report-hidden">
        <div class="section">
            <div class="section-title">📄实习约定确认卡</div>
            <div id="reportContent"></div>
            <div style="margin-top:20px;">
                <h4>发给HR确认话术预览：</h4>
                <p id="confirmMsg" style="background:#f5f5f5;padding:12px;border-radius:6px;"></p>
            </div>
            <div style="margin-top:24px;color:#666;font-size:13px;border-top:1px solid #eee;padding-top:16px;">
                <strong>免责声明：</strong>本工具提供的内容仅作为实习参考，不替代劳动合同、实习协议或法律意见。评估结果不构成安全认证或者法律意见。
            </div>
        </div>
        <div class="no-print" style="text-align:center;margin-bottom:30px;">
            <button class="btn btn-primary" id="exportPdfBtn">一键导出PDF报告</button>
            <button class="btn" id="saveRecordBtn">保存本次评估到工作台</button>
        </div>
    </div>
</div>

<div class="modal" id="editModal">
    <div class="modal-box">
        <h3 id="modalTitle">编辑卡片信息</h3>
        <div style="margin:10px 0;">
            <label>状态</label>
            <select id="cardStatus" style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:6px;">
                <option value="clear">待填写</option>
                <option value="pending">待确认</option>
                <option value="confirm">已确认</option>
                <option value="na">不适用</option>
            </select>
        </div>
        <div style="margin:10px 0;">
            <label>填写内容</label>
            <textarea id="cardContent" rows="3"></textarea>
        </div>
        <div style="margin:10px 0;">
            <label>信息来源类型</label>
            <select id="cardSourceType" style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:6px;">
                <option value="">请选择来源</option>
                <option value="招聘页面">招聘页面</option>
                <option value="HR聊天记录">HR聊天记录</option>
                <option value="实习协议">实习协议</option>
                <option value="企业官网">企业官网</option>
            </select>
        </div>
        <div style="margin:10px 0;">
            <label>确认方</label>
            <input id="cardConfirmUser" placeholder="例如：企业HR">
        </div>
        <div style="display:flex;gap:10px;margin-top:20px;">
            <button id="modalSave" class="btn btn-success" style="flex:1">保存</button>
            <button id="modalClose" class="btn" style="flex:1">取消</button>
        </div>
    </div>
</div>

<script>
// 状态中文映射
const statusMap = {
    clear:"待填写",
    pending:"待确认",
    confirm:"已确认",
    na:"不适用"
};

//风险核验规则库
const riskRuleList = [
    {id:"H1",title:"是否收取押金、培训费、服装费等费用",danger:true,tip:"收费类实习存在诈骗风险，正规实习不得向学生收取任何费用",suggestion:"拒绝缴纳任何费用，更换实习单位"},
    {id:"H2",title:"是否要求刷单、垫付资金、转账操作",danger:true,tip:"垫付刷单属于典型电信诈骗套路",suggestion:"直接放弃该实习机会"},
    {id:"H3",title:"是否扣押身份证、学生证等个人证件",danger:true,tip:"用人单位不得扣押学生证件",suggestion:"拒绝提交证件原件"},
    {id:"H4",title:"承诺超高底薪、无责高薪，收入明显超出市场水平",danger:false,tip:"薪资描述模糊虚高，需要核实薪资构成",suggestion:"向HR确认底薪、提成、发放时间，留存聊天记录"},
    {id:"H5",title:"工作地点异地外派，要求独自前往陌生城市",danger:false,tip:"异地实习安全风险较高",suggestion:"确认企业资质、住宿保障，告知家长行程"},
];

//核心卡片配置
const coreCardDef = [
    {key:"c1",name:"实习薪资"},
    {key:"c2",name:"薪资发放时间"},
    {key:"c3",name:"薪资发放方式"},
    {key:"c4",name:"每日工作时长"},
    {key:"c5",name:"休息日安排"},
    {key:"c6",name:"实习起止日期"},
    {key:"c7",name:"实习岗位名称"},
    {key:"c8",name:"实际工作地点"},
    {key:"c9",name:"加班补偿规则"},
    {key:"c10",name:"实习证明开具约定"},
];
const expandCardDef = [
    {key:"e1",name:"食宿安排"},
    {key:"e2",name:"交通补贴"},
    {key:"e3",name:"安全保障/意外险"},
];

//全局数据
let hAnswer = {};
let cardData = {};
let currentEditKey = null;

//DOM对象
const dom = {
    companyName:document.getElementById("companyName"),
    postName:document.getElementById("postName"),
    jobText:document.getElementById("jobText"),
    hList:document.getElementById("hList"),
    coreCardWrap:document.getElementById("coreCardWrap"),
    expandCardWrap:document.getElementById("expandCardWrap"),
    toggleExpandBtn:document.getElementById("toggleExpandBtn"),
    expandPanel:document.getElementById("expandPanel"),
    calcResultBtn:document.getElementById("calcResultBtn"),
    resultWrap:document.getElementById("resultWrap"),
    reportArea:document.getElementById("reportArea"),
    reportContent:document.getElementById("reportContent"),
    confirmMsg:document.getElementById("confirmMsg"),
    exportPdfBtn:document.getElementById("exportPdfBtn"),
    saveRecordBtn:document.getElementById("saveRecordBtn"),
    editModal:document.getElementById("editModal"),
    modalTitle:document.getElementById("modalTitle"),
    cardStatus:document.getElementById("cardStatus"),
    cardContent:document.getElementById("cardContent"),
    cardSourceType:document.getElementById("cardSourceType"),
    cardConfirmUser:document.getElementById("cardConfirmUser"),
    modalSave:document.getElementById("modalSave"),
    modalClose:document.getElementById("modalClose"),
    ocrFile:document.getElementById("ocrFile"),
    ocrBtn:document.getElementById("ocrBtn"),
    ocrTip:document.getElementById("ocrTip"),
};

//监听输入变更，修改任意一项基础信息重置全部核验结果
["companyName","postName","jobText"].forEach(id=>{
    document.getElementById(id).addEventListener("change",()=>{
        if(confirm("原核验结果已失效，请重新确认风险项与约定卡片，是否清空全部填写记录？")){
            resetAllData();
        }
    })
})

function resetAllData(){
    hAnswer = {};
    cardData = {};
    renderHList();
    renderCards();
    dom.reportArea.classList.add("report-hidden");
    dom.resultWrap.innerHTML = "";
}

//渲染风险核验列表
function renderHList(){
    dom.hList.innerHTML = "";
    riskRuleList.forEach(rule=>{
        const item = document.createElement("div");
        item.className = "h-item";
        item.innerHTML = `
            <div class="h-text">${rule.title}</div>
            <div class="h-radio-group">
                <label><input type="radio" name="${rule.id}" value="yes">是</label>
                <label><input type="radio" name="${rule.id}" value="no">否</label>
                <label><input type="radio" name="${rule.id}" value="unknown" checked>不确定</label>
            </div>
        `;
        dom.hList.appendChild(item);
        //回填历史值
        if(hAnswer[rule.id]){
            item.querySelector(`input[value="${hAnswer[rule.id]}"]`).checked = true;
        }
        //保存选择
        item.querySelectorAll("input").forEach(radio=>{
            radio.onchange = ()=>{
                hAnswer[rule.id] = radio.value;
            }
        })
    })
}

//渲染卡片
function renderCards(){
    dom.coreCardWrap.innerHTML = "";
    dom.expandCardWrap.innerHTML = "";
    [...coreCardDef,...expandCardDef].forEach(def=>{
        const d = cardData[def.key] || {status:"clear",content:"",source:"",confirm:""};
        const card = document.createElement("div");
        card.className = `c-card status-${d.status}`;
        card.innerText = `${def.name}（${statusMap[d.status]}）`;
        card.onclick = ()=>openEditModal(def.key,def.name);
        if(coreCardDef.find(x=>x.key===def.key)){
            dom.coreCardWrap.appendChild(card);
        }else{
            dom.expandCardWrap.appendChild(card);
        }
    })
}

//弹窗编辑卡片
function openEditModal(key,name){
    currentEditKey = key;
    dom.modalTitle.innerText = `编辑：${name}`;
    const d = cardData[key] || {status:"clear",content:"",source:"",confirm:""};
    dom.cardStatus.value = d.status;
    dom.cardContent.value = d.content;
    dom.cardSourceType.value = d.source || "";
    dom.cardConfirmUser.value = d.confirm || "";
    dom.editModal.style.display = "flex";
}

//关闭弹窗
dom.modalClose.onclick = ()=>{
    dom.editModal.style.display = "none";
}

//保存卡片，增加强校验规则
dom.modalSave.onclick = ()=>{
    const status = dom.cardStatus.value;
    const content = dom.cardContent.value.trim();
    const source = dom.cardSourceType.value.trim();
    const confirmUser = dom.cardConfirmUser.value.trim();
    //标记为已确认时必须全部填写
    if(status === "confirm"){
        if(!content || !source || !confirmUser){
            alert("标记为已确认时，必须填写具体内容、信息来源与确认方");
            return;
        }
    }
    cardData[currentEditKey] = {status,content,source,confirm:confirmUser};
    renderCards();
    dom.editModal.style.display = "none";
}

//展开拓展卡片
dom.toggleExpandBtn.onclick = ()=>{
    dom.expandPanel.classList.toggle("show");
}

//生成报告校验逻辑
dom.calcResultBtn.onclick = ()=>{
    const company = dom.companyName.value.trim();
    const post = dom.postName.value.trim();
    //校验1：基础信息不能为空
    if(!company || !post){
        alert("请先填写企业名称和实习岗位，并完成必要的风险核验");
        return;
    }
    //收集命中的高危规则
    const hitDangerRule = [];
    riskRuleList.forEach(rule=>{
        const val = hAnswer[rule.id] || "unknown";
        if(val === "yes" && rule.danger){
            hitDangerRule.push(rule);
        }
    })
    //收集待确认项
    const pendingCardList = Object.values(cardData).filter(it=>it.status==="pending");
    const confirmCardList = Object.values(cardData).filter(it=>it.status==="confirm");

    //判定风险等级，红黄绿三色
    let riskLevel,riskClass,riskText;
    if(hitDangerRule.length>0){
        riskLevel = "red";
        riskClass = "red";
        riskText = "🔴高风险";
    }else if(pendingCardList.length>0 || confirmCardList.length < 4){
        riskLevel = "yellow";
        riskClass = "yellow";
        riskText = "🟡待核验";
    }else{
        riskLevel = "green";
        riskClass = "green";
        riskText = "🟢风险可控";
    }

    //拼装风险详情文本，逐条展示命中规则
    let detailText = `评估结果：${riskText}\n`;
    if(hitDangerRule.length>0){
        detailText += "\n=====命中高危风险条目=====\n";
        hitDangerRule.forEach(item=>{
            detailText += `【${item.id}】${item.title}\n风险说明：${item.tip}\n建议操作：${item.suggestion}\n`;
        })
    }else{
        detailText += "\n暂未识别出高危实习风险\n";
    }

    dom.resultWrap.innerHTML = `<div class="result-block ${riskClass}">${detailText}</div>`;

    //渲染PDF报告：只筛选有填写内容的卡片
    let reportHtml = `<div><strong>企业名称：</strong>${company}</div><div><strong>实习岗位：</strong>${post}</div><br/>`;
    const filledCard = Object.entries(cardData).filter(([k,v])=>v.content.trim()!=="");
    filledCard.forEach(([key,val])=>{
        const def = [...coreCardDef,...expandCardDef].find(d=>d.key===key);
        reportHtml += `
        <div style="padding:8px 0;border-bottom:1px solid #eee;">
            <div><strong>${def.name}</strong>｜状态：${statusMap[val.status]}</div>
            <div>约定内容：${val.content}</div>
            <div>信息来源：${val.source}｜确认方：${val.confirm}</div>
        </div>`;
    })
    dom.reportContent.innerHTML = reportHtml;
    dom.confirmMsg.innerText = `您好，向您确认本次实习相关约定信息：\n${filledCard.map(([k,v])=>v.content).join("；")}`;
    dom.reportArea.classList.remove("report-hidden");
}

//导出PDF打印
dom.exportPdfBtn.onclick = ()=>{
    window.print();
}

//OCR识图简易调用
dom.ocrBtn.onclick = async ()=>{
    const file = dom.ocrFile.files[0];
    if(!file)return alert("请先选择截图文件");
    dom.ocrTip.innerText = "识别加载中...";
    const worker = await Tesseract.createWorker("chi_sim");
    const ret = await worker.recognize(file);
    dom.jobText.value = ret.data.text;
    dom.ocrTip.innerText = "识别完成";
    await worker.terminate();
}

//初始化页面
renderHList();
renderCards();
</script>
</body>
</html>
