<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实习有约｜风险体检系统</title>
    <script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
        body{background:#f5f7fa;padding:24px 16px;max-width:1100px;margin:0 auto;}
        .container{background:#fff;padding:28px;border-radius:16px;box-shadow:0 4px 16px #00000012;}
        h1{text-align:center;color:#2c3e50;margin-bottom:24px;font-size:24px;}
        .home-card-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:30px;}
        .home-card{padding:30px 16px;background:#f0f4f8;border-radius:14px;text-align:center;cursor:pointer;transition:0.2s;}
        .home-card:hover{background:#e1eaf3;transform:translateY(-4px);}
        .home-card h3{font-size:18px;color:#2c3e50;margin-bottom:8px;}
        .home-card p{font-size:14px;color:#666;}
        .risk-area{border-top:1px solid #eee;padding-top:24px;}
        textarea{width:100%;min-height:130px;border:1px solid #dde2e8;border-radius:10px;padding:14px;font-size:15px;resize:vertical;margin-bottom:16px;}
        .btn-group{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
        button{padding:11px 20px;border:none;border-radius:8px;color:#fff;font-size:15px;cursor:pointer;}
        .btn-blue{background:#3488eb;}
        .btn-green{background:#27ae60;}
        .btn-purple{background:#9b59b6;}
        .btn-yellow{background:#f1c40f;color:#222;margin:20px auto;display:block;padding:12px 24px;font-weight:bold;}
        .danger-tip{background:#ffe9e9;color:#c0392b;border:2px solid #ec7063;padding:14px;border-radius:10px;margin-bottom:20px;text-align:center;font-weight:bold;}
        .risk-item{background:#fef0f0;border-left:5px solid #e74c3c;padding:14px;border-radius:8px;margin-bottom:12px;}
        .grid-card{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px;}
        .contract-card{background:#fff9ef;border:1px solid #f8d7b9;padding:14px;border-radius:10px;cursor:pointer;transition:0.2s;}
        .contract-card:hover{box-shadow:0 2px 8px #00000015;}
        .card-title{font-weight:bold;margin-bottom:6px;color:#d35400;}
        .card-desc{font-size:14px;color:#666;min-height:40px;}
        .card-empty{color:#e67e22;font-size:13px;margin-top:6px;}
        .pop-panel{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:99;}
        .pop-box{background:#fff;width:90%;max-width:500px;padding:24px;border-radius:14px;}
        .pop-box h3{margin-bottom:12px;color:#2c3e50;}
        .pop-box textarea{margin:8px 0;min-height:100px;width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;}
        .pop-btn{display:flex;gap:10px;margin-top:15px;justify-content:flex-end;}
        .hidden{display:none !important;}
        #imgFile{display:none;}
    </style>
</head>
<body>
<div class="container">
    <h1>实习有约｜风险体检系统</h1>
    <div class="home-card-wrap">
        <div class="home-card" onclick="showInternPanel()">
            <h3>实习风险评估</h3>
            <p>岗位风险检测、实习工作台</p >
        </div>
        <div class="home-card" onclick="alert('该功能正在开发中，敬请期待！')">
            <h3>线上兼职</h3>
            <p>功能开发中</p >
        </div>
    </div>

    <div id="internPanel" class="risk-area" style="display:none;">
        <textarea id="jobText" placeholder="粘贴完整实习岗位描述，或上传截图识别文字"></textarea>
        <div class="btn-group">
            <button class="btn-blue" onclick="document.getElementById('imgFile').click()">上传截图识别文字</button>
            <input id="imgFile" type="file" accept="image/*">
            <button class="btn-green" onclick="checkRisk()">生成评估卡片</button>
            <button class="btn-purple" onclick="exportPdf()">导出PDF报告</button>
        </div>
        <div id="warnBox"></div>
        <div id="riskList"></div>
        <div class="grid-card" id="contractWrap"></div>
        <button id="enterWorkBtn" class="btn-yellow hidden" onclick="window.location.href='intern.html'">进入实习工作台</button>
    </div>
</div>

<div class="pop-panel" id="editModal">
    <div class="pop-box">
        <h3 id="modalTitle"></h3>
        <textarea id="modalInput"></textarea>
        <div class="pop-btn">
            <button class="btn-blue" onclick="closeModal()">取消</button>
            <button class="btn-green" onclick="saveCard()">保存</button>
        </div>
    </div>
</div>

<div id="pdfDom" style="display:none;padding:20px;"></div>

<script>
let cardData = JSON.parse(localStorage.getItem("contractCard")) || {
    c01:"",c02:"",c03:"",c04:"",c05:"",c06:"",c07:"",c08:"",c09:"",c10:""
};
let editKey = "";

const riskRule = [
    {
        id:"H01",
        words:["押金","培训费","服装费","体检费","建档费","保证金"],
        deny:["不收取","不收","无需","免除","无","不会收取"]
    },
    {id:"H02",words:["刷单","垫付","转账","充值"],deny:[]},
    {id:"H03",words:["日赚几百","高额佣金","轻松赚钱"],deny:[]}
];

const cardMeta = [
    {key:"c01",title:"用人主体",tip:"单位全称 + 官方核验渠道"},
    {key:"c02",title:"岗位职责",tip:"岗位名称 + 主要任务"},
    {key:"c03",title:"工作地点",tip:"具体地址 / 远程安排"},
    {key:"c04",title:"实习期限",tip:"开始 — 结束日期"},
    {key:"c05",title:"出勤工时",tip:"每周天数 × 每日小时"},
    {key:"c06",title:"报酬标准",tip:"金额 + 计量单位"},
    {key:"c07",title:"结算安排",tip:"周期 + 支付方式 / 主体"},
    {key:"c08",title:"带教考核",tip:"带教人/部门/反馈/考核"},
    {key:"c09",title:"安全保障",tip:"培训/防护/保险/联系人"},
    {key:"c10",title:"退出与证明",tip:"退出/结算/证明条件"}
];

function parseAutoFill(text){
    let newFill = {};
    let companyMatch = text.match(/([^，。；]*?(有限公司|文化传媒|科技公司|实业集团))/);
    newFill.c01 = companyMatch ? companyMatch[1].trim() : "";

    let jobMatch = text.match(/([^，。；]*?(实习生|助理|文员))/);
    newFill.c02 = jobMatch ? jobMatch[1].trim() : "";

    let addrMatch = text.match(/(.+市.+区.*?(大厦|园区|街道|写字楼))/);
    newFill.c03 = addrMatch ? addrMatch[1].trim() : "";

    let dateMatch = text.match(/(\d{4}-\d{1,2}-\d{1,2}).*?(\d{4}-\d{1,2}-\d{1,2})/);
    newFill.c04 = dateMatch ? `${dateMatch[1]} 至 ${dateMatch[2]}` : "";

    let workTime = text.match(/周一至周五.*?(\d{1,2}[:：]\d{2}).*?(\d{1,2}[:：]\d{2})/);
    newFill.c05 = workTime ? `周一至周五 ${workTime[1]}-${workTime[2]}` : "";

    let salaryMatch = text.match(/(\d+)元\/天/);
    newFill.c06 = salaryMatch ? `${salaryMatch[1]}元/天实习补贴` : "";

    newFill.c07 = text.includes("按月") || text.includes("月结") ? "按月对公转账发放" : "";
    newFill.c08 = text.includes("带教老师") ? "配备专职带教老师，实习结束出具评价" : "";
    newFill.c09 = text.includes("意外险") || text.includes("保险") ? "公司提供办公意外险，配备紧急联系人" : "";
    newFill.c10 = text.includes("实习证明") ? "实习考核合格，可开具实习证明" : "";

    for(let k in newFill){
        if(!cardData[k]){
            cardData[k] = newFill[k];
        }
    }
    localStorage.setItem("contractCard",JSON.stringify(cardData));
}

function renderCard(){
    let html = "";
    cardMeta.forEach(item=>{
        let val = cardData[item.key];
        let showText = val || "<span class='card-empty'>⚠ 待点击补全信息</span>";
        html += `<div class='contract-card' onclick='openEdit("${item.key}","${item.title}")'>
            <div class='card-title'>${item.title}</div>
            <div class='card-desc'>${showText}</div>
        </div>`;
    })
    document.getElementById("contractWrap").innerHTML = html;
    checkUnlock();
}

function checkNearDeny(fullText,hitWord,denyList){
    let pos = fullText.indexOf(hitWord);
    let start = Math.max(0,pos - 30);
    let end = Math.min(fullText.length,pos + 30);
    let sliceText = fullText.slice(start,end);
    return denyList.some(word => sliceText.includes(word));
}

function checkUnlock(){
    const allFilled = Object.values(cardData).some(v=>v.trim()!=='');
    const btn = document.getElementById("enterWorkBtn");
    if(allFilled) btn.classList.remove("hidden");
    else btn.classList.add("hidden");
}

function checkRisk(){
    let text = document.getElementById("jobText").value;
    parseAutoFill(text);
    let warnHtml = "";
    let riskHtml = "";
    riskRule.forEach(rule=>{
        let hitWord = rule.words.find(w=>text.includes(w));
        if(hitWord){
            const hasNearDeny = checkNearDeny(text,hitWord,rule.deny);
            if(!hasNearDeny){
                warnHtml = `<div class='danger-tip'>● 检测到实习高危风险，请谨慎对待</div>`;
                riskHtml += `<div class='risk-item'><b>${rule.id}</b>｜存在收费类高危风险<br>正规实习不得提前收取费用<br>建议：拒绝缴费，核实企业资质</div>`;
            }
        }
    })
    document.getElementById("warnBox").innerHTML = warnHtml;
    document.getElementById("riskList").innerHTML = riskHtml;
    renderCard();
}

document.getElementById("imgFile").onchange = async function(e){
    const file = e.target.files[0];
    if(!file)return;
    alert("识别中，请稍候...");
    const res = await Tesseract.recognize(file,"chi_sim");
    document.getElementById("jobText").value = res.data.text;
}

function openEdit(key,title){
    editKey = key;
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalInput").value = cardData[key];
    document.getElementById("editModal").style.display = "flex";
}
function closeModal(){
    document.getElementById("editModal").style.display = "none";
}
function saveCard(){
    cardData[editKey] = document.getElementById("modalInput").value.trim();
    localStorage.setItem("contractCard",JSON.stringify(cardData));
    closeModal();
    renderCard();
}

function exportPdf(){
    let dom = document.getElementById("pdfDom");
    dom.innerHTML = `<h2>实习岗位风险评估报告</h2><div>${document.getElementById("warnBox").innerHTML}</div>`;
    html2pdf().set({margin:12}).from(dom).save("实习风险报告.pdf");
}
function showInternPanel(){
    document.getElementById("internPanel").style.display = "block";
    renderCard();
}
renderCard();
</script>
</body>
</html>
