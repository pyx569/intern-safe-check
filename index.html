<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实习有约｜风险体检系统</title>
    <script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
        body{background:#f5f7fa;padding:24px 16px;max-width:1100px;margin:0 auto;}
        .container{background:#fff;padding:28px;border-radius:16px;box-shadow:0 4px 16px #00000012;}
        h1{text-align:center;color:#2c3e50;margin-bottom:24px;font-size:24px;}

        .home-card-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:30px;}
        .home-card{padding:30px 16px;background:#f0f4f8;border-radius:14px;text-align:center;cursor:pointer;transition:0.2s;}
        .home-card:hover{background:#e1eaf3;transform:translateY(-4px);}
        .home-card h3{font-size:18px;color:#2c3e50;margin-bottom:8px;}
        .home-card p{font-size:14px;color:#666;}

        .risk-area{border-top:1px solid #eee;padding-top:24px;}
        textarea{width:100%;min-height:130px;border:1px solid #dde2e8;border-radius:10px;padding:14px;font-size:15px;resize:vertical;margin-bottom:16px;}
        .btn-group{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
        button{padding:11px 20px;border:none;border-radius:8px;color:#fff;font-size:15px;cursor:pointer;}
        .btn-blue{background:#3488eb;}
        .btn-green{background:#27ae60;}
        .btn-purple{background:#9b59b6;}
        .btn-yellow{background:#f1c40f;color:#222;}
        .ocr-tip{color:#666;margin-bottom:16px;font-size:14px;}
        #imgFile{display:none;}

        .risk-bar-red{background:#ffe9e9;border:2px solid #e74c3c;color:#c0392b;padding:12px;border-radius:8px;text-align:center;font-weight:bold;font-size:17px;margin:18px 0;}
        .risk-bar-orange{background:#fff3e0;border:2px solid #f57c00;color:#e65100;padding:12px;border-radius:8px;text-align:center;font-weight:bold;font-size:17px;margin:18px 0;}
        .risk-bar-yellow{background:#fffde7;border:2px solid #f1c40f;color:#856404;padding:12px;border-radius:8px;text-align:center;font-weight:bold;font-size:17px;margin:18px 0;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;}

        .card-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px;}
        .card{padding:18px;border-radius:12px;border-left:6px solid #ccc;cursor:pointer;transition:0.2s;}
        .card:hover{transform:translateY(-2px);box-shadow:0 3px 10px #00000015;}
        .card-red{background:#ffe9e9;border-left-color:#e74c3c;}
        .card-orange{background:#fff3e0;border-left-color:#f57c00;}
        .card-green{background:#eafaf1;border-left-color:#27ae60;}

        .card-title{font-weight:bold;font-size:16px;margin-bottom:6px;}
        .card-desc{font-size:14px;color:#444;line-height:1.5;margin-bottom:6px;}
        .card-tip{font-size:13px;color:#666;}
        .split-title{font-size:18px;font-weight:bold;margin:28px 0 10px;color:#2c3e50;}
        .footer-tip{margin-top:24px;font-size:14px;color:#777;text-align:center;}
    </style>
</head>
<body>
<div class="container">
    <h1>实习有约｜风险体检系统</h1>
    <!--首页两大入口：实习｜兼职-->
    <div class="home-card-wrap">
        <div class="home-card" onclick="showInternPanel()">
            <h3>实习风险评估</h3>
            <p>岗位风险检测、实习工作台</p >
        </div>
        <div class="home-card" onclick="partTimeDev()">
            <h3>线上兼职</h3>
            <p>功能开发中</p >
        </div>
    </div>

    <div id="internPanel" class="risk-area" style="display:none;">
        <textarea id="inputText" placeholder="粘贴招聘文案，或上传截图识别文字"></textarea>
        <div class="btn-group">
            <button class="btn-blue" onclick="document.getElementById('imgFile').click()">上传截图识别文字</button>
            <button class="btn-green" onclick="checkRisk()">生成评估卡片</button>
            <button class="btn-purple" onclick="exportPdf()">导出PDF报告</button>
        </div>
        <input type="file" id="imgFile" accept="image/*">
        <div class="ocr-tip" id="ocrTip"></div>
        <div id="reportBox"></div>
    </div>
</div>

<script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
//兼职入口弹窗提示
function partTimeDev(){
    alert("该功能正在开发中，敬请期待！");
}
//展示实习完整功能面板
function showInternPanel(){
    document.getElementById("internPanel").style.display = "block";
}

const highRiskList = [
    {id:"H01",name:"入职前收费｜押金｜培训费",keywords:["收费","押金","保证金","培训费","服装费"],title:"存在收费类高危风险",explain:"正规实习不得提前收取费用",action:"拒绝缴费，核实企业资质"},
    {id:"H02",name:"培训贷｜付费上岗",keywords:["贷款","分期缴费","先培训后付费"],title:"培训贷风险",explain:"警惕借贷上岗套路",action:"放弃该岗位，保护个人征信"},
    {id:"H03",name:"私人转账收款",keywords:["微信转账","支付宝私发","个人账户收款"],title:"个人账户收款风险",explain:"企业收费应当走对公账户",action:"拒绝私人转账要求"},
    {id:"H04",name:"非官方远程管控设备",keywords:["屏幕共享","远程控制手机","接管账号"],title:"远程操控设备风险",explain:"不要交出手机账号控制权",action:"终止沟通并报警备案"},
    {id:"H05",name:"索要银行卡验证码",keywords:["验证码","短信码","银行卡密码"],title:"验证码诈骗风险",explain:"验证码等同于资金权限",action:"绝对不提供验证码"},
    {id:"H06",name:"刷单垫付任务",keywords:["刷单","垫付资金","返佣金"],title:"刷单诈骗风险",explain:"刷单属于违法行为",action:"直接拒绝该岗位"},
    {id:"H07",name:"虚假企业冒用身份招聘",keywords:["冒用公司","高仿官网"],title:"企业身份存疑",explain:"独立核验企业工商信息",action:"企查查/天眼查核验资质"},
    {id:"H08",name:"扣押证件原件",keywords:["扣押身份证","保管毕业证"],title:"扣押证件风险",explain:"任何单位无权扣押个人证件",action:"拒绝提交原件"}
];

const contractList = [
    {cid:"C01",name:"用人主体",show:"单位全称 + 官方核验渠道",field:"company_name,company_official_contact"},
    {cid:"C02",name:"岗位职责",show:"岗位名称 + 主要任务",field:"job_title,job_duties"},
    {cid:"C03",name:"工作地点",show:"具体地址 / 远程安排",field:"work_location"},
    {cid:"C04",name:"实习期限",show:"开始 — 结束日期",field:"start_date,end_date"},
    {cid:"C05",name:"出勤工时",show:"每周天数 × 每日小时",field:"days_per_week,hours_per_day"},
    {cid:"C06",name:"报酬标准",show:"金额 + 计量单位",field:"compensation_amount,compensation_unit"},
    {cid:"C07",name:"结算安排",show:"周期 + 支付方式 / 主体",field:"settlement_cycle,payment_method"},
    {cid:"C08",name:"带教考核",show:"带教人/部门/反馈/考核",field:"supervisor_name,evaluation_method"},
    {cid:"C09",name:"安全保障",show:"培训/防护/保险/联系人",field:"safety_insurance"},
    {cid:"C10",name:"退出与证明",show:"退出/结算/证明条件",field:"exit_terms,certificate_arrangement"}
];

let fillData = JSON.parse(localStorage.getItem("internFill"))||{};

document.getElementById("imgFile").onchange = async function(e){
    const tip = document.getElementById("ocrTip");
    tip.innerText = "识别中，请等待……";
    const img = e.target.files[0];
    const res = await Tesseract.recognize(img,"chi_sim");
    document.getElementById("inputText").value = res.data.text;
    tip.innerText = "识别完成，请核对文字";
};

function goFill(cid){
    window.location.href = `fill.html?id=${cid}`;
}
function goInternPage(){
    window.location.href = "intern.html";
}

function checkRisk(){
    const textRaw = document.getElementById("inputText").value.toLowerCase();
    const box = document.getElementById("reportBox");
    let html = "";

    const hitRisk = highRiskList.filter(item=>item.keywords.some(k=>textRaw.includes(k)));
    const missList = contractList.filter(c => !fillData[c.cid]);
    const isAllComplete = missList.length === 0;

    if(hitRisk.length>0){
        html += `<div class="risk-bar-red">🔴 检测到实习高危风险，请谨慎对待</div>`;
        html += `<div class="card-wrap">`;
        hitRisk.forEach(r=>{
            html += `<div class="card card-red">
                <div class="card-title">${r.id}｜${r.name}</div>
                <div class="card-desc">${r.title}</div>
                <div class="card-tip">${r.explain}<br/>建议：${r.action}</div>
            </div>`;
        })
        html += `</div>`;
    }else if(!isAllComplete){
        html += `<div class="risk-bar-orange">🟠 岗位信息存在待确认项，请补全实习约定内容</div>`;
    }else{
        html += `<div class="risk-bar-yellow">
            ✨ 暂未检测出问题，你可以开始实习了
            <button class="btn-yellow" onclick="goInternPage()">进入实习页面</button>
        </div>`;
    }

    html += `<div class="split-title">📋 最小实习约定集卡片</div>`;
    html += `<div class="card-wrap">`;
    contractList.forEach(card=>{
        const content = fillData[card.cid]||"";
        let cls = content ? "card-green" : "card-orange";
        html += `<div class="card ${cls}" onclick="goFill('${card.cid}')">
            <div class="card-title">${card.cid} ${card.name}</div>
            <div class="card-desc">展示内容：${card.show}</div>
            <div class="card-tip">${content?"✅ 信息已完善":"⚠️ 待点击补全信息"}</div>
        </div>`;
    })
    html += `</div>`;
    html += `<div class="footer-tip">本工具仅作为实习风险辅助评估，不具备法律合同效力</div>`;
    box.innerHTML = html;
}

function exportPdf(){
    const el = document.querySelector(".container");
    html2pdf().set({margin:12}).from(el).save("实习风险评估报告.pdf");
}
</script>
</body>
</html>
