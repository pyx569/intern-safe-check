<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷录入｜实习有约【测试版】</title>
    <script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #ffffff;
            padding: 40px 20px;
            color:#333;
        }
        .test-tip{
            background:#fffbe6;
            border:1px solid #ffcc00;
            border-radius:8px;
            padding:12px 16px;
            color:#fa8c16;
            font-weight:bold;
            text-align:center;
            margin-bottom:24px;
        }
        .container{
            max-width:1100px;
            margin:0 auto;
        }
        .header-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }
        .btn{
            padding:8px 16px;
            border-radius:6px;
            border:none;
            cursor:pointer;
            font-size:14px;
        }
        .btn-primary{
            background:#1677ff;
            color:#fff;
        }
        .btn-warning{
            background:#faad14;
            color:#fff;
        }
        .btn-danger{
            background:#ff4d4f;
            color:#fff;
        }
        .btn-success{
            background:#52c41a;
            color:#fff;
        }
        .section{
            margin-bottom:32px;
            border:1px solid #eee;
            border-radius:10px;
            padding:24px;
        }
        .section-title{
            font-size:18px;
            font-weight:bold;
            margin-bottom:16px;
        }
        textarea,input{
            width:100%;
            border:1px solid #d9d9d9;
            border-radius:6px;
            padding:10px;
            font-size:14px;
        }
        .card-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill,minmax(240px,1fr));
            gap:16px;
            margin-top:16px;
        }
        .c-card{
            border-radius:8px;
            padding:14px;
            border:1px solid #ddd;
            cursor:pointer;
        }
        .status-clear{background:#fff;border-color:#ccc;}
        .status-pending{background:#fffbe6;border-color:#ffe58f;}
        .status-confirm{background:#f6ffed;border-color:#b7eb8f;}
        .status-na{background:#f5f5f5;border-color:#d9d9d9;color:#666;}
        .result-block{
            padding:20px;
            border-radius:8px;
            margin:20px 0;
            white-space: pre‑line;
            line-height:1.8;
        }
        .red{background:#fff1f0;border:1px solid #ffa39e;}
        .yellow{background:#fffbe6;border:1px solid #ffe58f;}
        .green{background:#f6ffed;border:1px solid #b7eb8f;}
        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.4);
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .modal-box{
            background:#fff;
            padding:24px;
            border-radius:10px;
            width:90%;
            max-width:520px;
        }
        .report-hidden{
            display:none;
        }
        .h-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:14px 0;
            border-bottom:1px solid #eee;
            gap:20px;
        }
        .h-text{
            flex:1;
            line-height:1.6;
        }
        .h-radio-group{
            flex-shrink:0;
            white-space:nowrap;
            display:flex;
            gap:14px;
            align-items:center;
        }
        .h-radio-group label{
            display:flex;
            align-items:center;
            gap:4px;
            cursor:pointer;
        }
        .h-radio-group input[type="radio"]{
            width:auto;
            margin:0;
        }
        .input-row{
            display:flex;
            gap:16px;
            flex-wrap:wrap;
            align-items:center;
            margin-top:10px;
        }
        .input-item{
            flex:1;
            min-width:200px;
        }
        .expand-btn-area{
            text-align:center;
            margin-top:18px;
        }
        .expand-content{
            display:none;
            margin-top:16px;
        }
        .expand-content.show{
            display:block;
        }
        .report-item{
            padding:8px 0;
            border-bottom:1px solid #efefef;
            line-height:1.7;
        }
        .btn-group-row{
            display:flex;
            gap:12px;
            justify-content:center;
            flex-wrap:wrap;
        }
        .no-print{}
        @media print{
            .no-print{display:none !important;}
            .result-block{display:none !important;}
            body{padding:0;background:#fff;}
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header-bar no-print">

        </div>
        <div class="input-row">
            <div class="input-item">
                <label>单位全称：</label>

            </div>
            <div class="input-item">
                <label>岗位名称：</label>
                <input id="postName" placeholder="填写实习岗位">
            </div>
            <div style="margin-top:22px">
                <button class="btn btn-primary" id="checkCompanyBtn">一键工商核验</button>

    </div>

    </div>

    <div class="no-print btn-group-row">

    </div>

    <div id="resultWrap" class="no-print"></div>

            <label>填写内容</label>
            <textarea id="cardContent" rows="3"></textarea>
        </div>
        <div style="margin:10px 0;">
            <label>信息来源类型</label>
            <select id="cardSourceType" style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:6px;">

                <option value="聊天记录">聊天记录</option>

            <button class="btn" id="cancelEdit">取消</button>
            <button class="btn btn-primary" id="saveEdit">保存</button>
        </div>
    </div>
</div>

<script>
const statusMap = {
    clear:"待填写",
    pending:"待确认",
    confirm:"已确认",
    na:"不适用"
};

const riskMeta = [
    {title:"收费/押金要求",tip:"收费类实习存在诈骗风险，正规实习不得向学生收取任何费用",suggest:"拒绝缴纳任何费用，更换实习单位"},

    {title:"异地外派风险",tip:"无正规办公地点的异地外派存在人身安全隐患",suggest:"核实企业资质、办公地址，谨慎前往异地"},

    {title:"异地外派风险",desc:"要求前往外地培训、上岗，不提供正规办公地址",keywords:["外地培训","异地","外派","边境"]},
    {title:"身份证件扣押",desc:"要求上交身份证、银行卡原件或者索要验证码",keywords:["扣押身份证","上交银行卡","验证码"]},
    {title:"借贷刷单任务",desc:"工作内容包含刷单、转账垫资、贷款操作",keywords:["刷单","垫付","转账","充值解冻"]},
    {title:"传销层级计酬",desc:"报酬依靠拉人头发展下线获取收益",keywords:["拉人头","下线","层级提成"]},
    {title:"空白合同签署",desc:"签署空白文件，放弃明确薪酬约定",keywords:["空白合同","空白协议"]},
    {title:"竞业无限扩大",desc:"协议包含宽泛无边界的竞业限制",keywords:["竞业","终身限制"]},

const cRawList = [
    {key:"C01",name:"实习薪资标准",core:true,disableNa:true},
    {key:"C02",name:"薪资发放时间",core:true,disableNa:true},
    {key:"C03",name:"工资发放方式",core:true,disableNa:true},
    {key:"C04",name:"每日工作时长",core:true,disableNa:true},
    {key:"C05",name:"每周休息安排",core:true,disableNa:true},
    {key:"C06",name:"实习起止日期",core:true,disableNa:true},
    {key:"C07",name:"实习具体岗位",core:true,disableNa:true},
    {key:"C08",name:"办公工作地点",core:true,disableNa:true},
    {key:"C09",name:"加班补偿规则",core:true,disableNa:true},
    {key:"C10",name:"实习证明开具约定",core:true,disableNa:true},
    {key:"C11",name:"住宿福利安排",core:false,disableNa:false},
    {key:"C12",name:"餐补交通补贴",core:false,disableNa:false},
    {key:"C13",name:"岗前培训内容",core:false,disableNa:false},
    {key:"C14",name:"培训费用承担方",core:false,disableNa:false},
    {key:"C15",name:"离职提前告知期限",core:false,disableNa:false},
    {key:"C16",name:"实习考核规则",core:false,disableNa:false},
    {key:"C17",name:"保险保障方案",core:false,disableNa:false},
    {key:"C18",name:"岗位调动约束条件",core:false,disableNa:false},
    {key:"C19",name:"保密协议内容",core:false,disableNa:false},
    {key:"C20",name:"违约追责条款",core:false,disableNa:false}
];

let currentEditKey = "";
let expandOpened = false;
let formData = {
    companyName:"",
    postName:"",
    jobText:"",
    hRule:[],
    cCard:{}
};

function initEmptyCard(){
    return {
        status:"clear",
        content:"",
        contentType:"协议",
        sourceNote:"",
        confirmBy:"",
        updatedAt:"",
        naReason:""
    }
}

resetAllData();

function resetAllData(){
    formData.hRule = hRawList.map(item=> ({...item,ans:"u"}));
    formData.cCard = {};
    cRawList.forEach(k=>formData.cCard[k.key]=initEmptyCard());
    document.getElementById("resultWrap").innerHTML = "";
    document.getElementById("reportArea").classList.add("report-hidden");
    renderH();
    renderCCard();
}

function renderH(){
    const wrap = document.getElementById("hList");
    wrap.innerHTML = "";
    formData.hRule.forEach((item,idx)=>{
        const div = document.createElement("div");
        div.className = "h-item";
        div.innerHTML = `
            <div class="h-text"><strong>${item.title}</strong> — ${item.desc}</div>
            <div class="h-radio-group">
                <label><input type="radio" name="h${idx}" value="y">是</label>
                <label><input type="radio" name="h${idx}" value="n">否</label>
                <label><input type="radio" name="h${idx}" value="u">不确定</label>
            </div>`;
        wrap.appendChild(div);
        document.querySelector(`input[name="h${idx}"][value="${item.ans}"]`).checked = true;
    });
    document.querySelectorAll('input[type="radio"]').forEach(radio=>{
        radio.onchange = function(){
            const idx = Number(this.name.replace("h",""));
            formData.hRule[idx].ans = this.value;
        };
    });
}

function autoRecommend(){
    const text = document.getElementById("jobText").value.toLowerCase();
    for(let i=0;i<hRawList.length;i++){
        const words = hRawList[i].keywords;
        const hit = words.some(w=>text.includes(w));
        formData.hRule[i].ans = hit ? "y":"u";
    }
    renderH();
    alert("已完成自动风险推荐，请人工复核修改！");
}

document.getElementById("autoGuessBtn").onclick = autoRecommend;

function renderCCard(){
    const coreWrap = document.getElementById("coreCardWrap");
    const expandWrap = document.getElementById("expandCardWrap");
    coreWrap.innerHTML = ""; expandWrap.innerHTML = "";
    cRawList.forEach(cfg=>{
        const cardData = formData.cCard[cfg.key];
        const dom = document.createElement("div");
        dom.className = `c-card status-${cardData.status}`;
        dom.innerText = cfg.name;
        dom.onclick = ()=>openEditModal(cfg.key);
        cfg.core ? coreWrap.appendChild(dom) : expandWrap.appendChild(dom);
    });
}

const toggleBtn = document.getElementById("toggleExpandBtn");
const expandPanel = document.getElementById("expandPanel");
toggleBtn.onclick = function(){
    expandOpened = !expandOpened;
    if(expandOpened){ expandPanel.classList.add("show"); toggleBtn.innerText = "收回拓展约定项";}
    else{ expandPanel.classList.remove("show"); toggleBtn.innerText = "展开拓展约定项";}
};

const modal = document.getElementById("editModal");
const naOption = document.getElementById("naOption");
const naReasonWrap = document.getElementById("naReasonWrap");
const cardStatusSel = document.getElementById("cardStatus");

cardStatusSel.onchange = function(){
    naReasonWrap.style.display = (this.value==="na")?"block":"none";
};

function openEditModal(key){
    currentEditKey = key;
    const cfg = cRawList.find(x=>x.key===key);
    document.getElementById("modalTitle").innerText = "编辑："+cfg.name;
    const d = formData.cCard[key];
    if(cfg.disableNa){
        naOption.style.display = "none";
        if(d.status === "na") d.status = "clear";
    }else{
        naOption.style.display = "block";
    }
    cardStatusSel.value = d.status;
    document.getElementById("cardContent").value = d.content;
    document.getElementById("cardSourceType").value = d.contentType;
    document.getElementById("cardSourceNote").value = d.sourceNote;
    document.getElementById("cardConfirmBy").value = d.confirmBy;
    document.getElementById("cardNaReason").value = d.naReason;
    naReasonWrap.style.display = (cardStatusSel.value==="na"&&!cfg.disableNa)?"block":"none";
    modal.style.display = "flex";
}

document.getElementById("cancelEdit").onclick = ()=>modal.style.display="none";

document.getElementById("saveEdit").onclick = function(){
    const cfg = cRawList.find(x=>x.key===currentEditKey);
    const obj = formData.cCard[currentEditKey];
    const st = document.getElementById("cardStatus").value.trim();
    const cnt = document.getElementById("cardContent").value.trim();
    const srcType = document.getElementById("cardSourceType").value.trim();
    const confirmUser = document.getElementById("cardConfirmBy").value.trim();
    const naReasonVal = document.getElementById("cardNaReason").value.trim();

    if(st === "confirm"){
        if(!cnt||!srcType||!confirmUser){
            alert("标记为【已确认】时，必须填写具体内容、信息来源与确认方！");
            return;
        }
    }
    if(st === "na"){
        if(!naReasonVal){
            alert("选择【不适用】必须填写不适用原因！");
            return;
        }
    }
    obj.status = st;
    obj.content = document.getElementById("cardContent").value;
    obj.contentType = document.getElementById("cardSourceType").value;
    obj.sourceNote = document.getElementById("cardSourceNote").value;
    obj.confirmBy = document.getElementById("cardConfirmBy").value;
    obj.naReason = document.getElementById("cardNaReason").value;
    obj.updatedAt = new Date().toLocaleString();
    modal.style.display = "none";
    renderCCard();
};

function calcRiskResult(){
    const yesList = [];
    for(let i=0;i<formData.hRule.length;i++){
        if(formData.hRule[i].ans === "y"){
            yesList.push(riskMeta[i]);
        }
    }

    const hasUnknown = formData.hRule.some(i=>i.ans === "u");
    const coreCards = cRawList.filter(item=>item.core);
    const coreAllConfirmed = coreCards.every(card=>{
        return formData.cCard[card.key].status === "confirm";
    });
    const unconfirmedCore = coreCards.filter(card=>{
        return formData.cCard[card.key].status !== "confirm";
    }).map(card=>card.name);

    if(yesList.length > 0){
        let text = "🔴 发现高风险信号\n\n";
        text += "以下风险核验项选择为「是」，存在明确高风险，不建议参与本次实习：\n";
        yesList.forEach(h=>{
            text += `——————————\n【风险项】${h.title}\n【风险说明】${h.tip}\n【行动建议】${h.suggest}\n`;
        });
        return {level:"red", text:text};
    }

    if(hasUnknown || !coreAllConfirmed){
        let text = "🟡 信息不足，暂不能形成低风险结论\n\n";
        if(hasUnknown){
            text += "存在部分风险项选择为「不确定」，请进一步核实岗位信息后重新评估。\n";
        }
        if(!coreAllConfirmed){
            text += "以下核心实习约定尚未全部确认，请补充填写并标记为「已确认」：\n";
            unconfirmedCore.forEach(name=>{
                text += `· ${name}\n`;
            });
        }
        text += "\n建议：补齐全部实习约定书面凭证，与HR确认后再行评估。";
        return {level:"yellow", text:text};
    }

    return {
        level:"green",
        text:"🟢 暂未发现明确高风险信号\n\n全部17项风险核验均为「否」，且10项核心实习约定均已确认。\n建议：留存全部书面实习协议与沟通记录，保障自身实习权益。"
    };
}

document.getElementById("calcResultBtn").onclick = function(){
    const company = document.getElementById("companyName").value.trim();
    const post = document.getElementById("postName").value.trim();
    if(!company||!post){
        alert("请先填写企业名称和实习岗位！");
        return;
    }

    formData.companyName = company;
    formData.postName = post;
    formData.jobText = document.getElementById("jobText").value.trim();
    const res = calcRiskResult();
    const wrap = document.getElementById("resultWrap");
    wrap.innerHTML = `<div class="result-block ${res.level}">${res.text}</div>`;

    let reportHtml = "<h4>核心实习约定卡片详情</h4>";
    cRawList.filter(item=>item.core).forEach(card=>{
        const d = formData.cCard[card.key];
        if(d.status === "clear") return;
        const statusText = statusMap[d.status];
        const showContent = d.content||"无";
        const sourceText = d.contentType||"协议";
        const confirmPerson = d.confirmBy||"—";
        let extra = d.status==="na"?`｜不适用原因：${d.naReason||""}`:"";
        reportHtml += `<div class="report-item"><strong>${card.name}</strong>｜状态：${statusText}｜内容：${showContent}｜来源：${sourceText}｜确认人：${confirmPerson}${extra}</div>`;
    });

    reportHtml += "<br><h4>拓展补充约定卡片详情</h4>";
    cRawList.filter(item=>!item.core).forEach(card=>{
        const d = formData.cCard[card.key];
        if(d.status === "clear") return;
        const statusText = statusMap[d.status];
        const showContent = d.content||"无";
        const sourceText = d.contentType||"协议";
        const confirmPerson = d.confirmBy||"—";
        let extra = d.status==="na"?`｜不适用原因：${d.naReason||""}`:"";
        reportHtml += `<div class="report-item"><strong>${card.name}</strong>｜状态：${statusText}｜内容：${showContent}｜来源：${sourceText}｜确认人：${confirmPerson}${extra}</div>`;
    });

    document.getElementById("reportContent").innerHTML = reportHtml;
    document.getElementById("confirmMsg").innerText = `您好，针对本次实习，我方确认以下实习约定，请核对：企业【${formData.companyName}】岗位【${formData.postName}】，请书面确认实习薪资、工时、休息、补贴等全部实习条款。`;
    document.getElementById("reportArea").classList.remove("report-hidden");
};

};

    const saveObj = {

const ocrFile = document.getElementById("ocrFile");
const ocrBtn = document.getElementById("ocrBtn");
const ocrTip = document.getElementById("ocrTip");
ocrBtn.onclick = async function(){
    const file = ocrFile.files[0];
    if(!file){ alert("请先选择一张岗位截图图片"); return; }
    ocrTip.innerText = "识别加载中，请稍候（超时15秒）";
    try{
        const worker = await Tesseract.createWorker("chi_sim");
        const ret = await worker.recognize(file);
        document.getElementById("jobText").value = ret.data.text;
        ocrTip.innerText = "识别完成";
        await worker.terminate();
    }catch(e){
        ocrTip.innerText = "识别失败，请手动输入文字";
    }
};
