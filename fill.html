<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实习有约｜简易风险速评</title>
<script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei",sans-serif;
}
body{
    background:#ffffff;
    padding:30px 20px;
    color:#333;
}
.container{
    max-width:1140px;
    margin:0 auto;
}
.test-tip{
    background:#fff7e6;
    border:1px solid #ffd591;
    border-radius:8px;
    padding:14px 18px;
    margin-bottom:20px;
    color:#d48806;
}
.header-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:10px;
}
.btn{
    padding:9px 18px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    font-size:14px;
}
.btn-primary{background:#1677ff;color:#fff;}
.btn-success{background:#52c41a;color:#fff;}
.btn-warning{background:#faad14;color:#fff;}
.section{
    border:1px solid #e8e8e8;
    border-radius:10px;
    padding:22px;
    margin-bottom:24px;
}
.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:16px;
}
textarea,input,select{
    width:100%;
    border:1px solid #d9d9d9;
    border-radius:6px;
    padding:10px;
    font-size:14px;
}
textarea{min-height:80px;resize:vertical;}
.question-row{
    padding:12px 0;
    border-bottom:1px solid #eee;
}
.opt-group{
    display:flex;gap:18px;margin-top:8px;
}
.result-block{
    padding:20px;border-radius:8px;margin:16px 0;white-space:pre-line;line-height:1.8;
}
.red{background:#fff1f0;border:1px solid #ffa39e;}
.orange{background:#fff7e6;border:1px solid #ffd591;}
.green{background:#f6ffed;border:1px solid #b7eb8f;}
.report-hidden{display:none;}
.report-item{padding:8px 0;border-bottom:1px solid #efefef;line-height:1.7;}
.no-print{}
@media print{
    .no-print{display:none !important;}
    body{padding:0;background:#fff;}
}
</style>
</head>
<body>
<div class="container">
    <!-- 测试提示 -->
    <div class="test-tip no-print">
        ⚠️该项目正在测试中，不建议正式使用，评估结果仅供参考
    </div>

    <div class="header-bar no-print">
        <h1>实习有约｜简易风险速评</h1>
        <div>
            <a href=" "><button class="btn">完整评估</button></a >
            <a href="intern.html"><button class="btn">我的工作台</button></a >
        </div>
    </div>

    <div class="section no-print">
        <div class="section-title">第一步：粘贴岗位描述 / 上传截图识别文字</div>
        <textarea id="jobText" rows="6" placeholder="粘贴招聘文案，也可以上传图片自动提取文字"></textarea>
        <div style="margin:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <input type="file" id="ocrFile" accept="image/*">
            <button class="btn btn-warning" id="ocrBtn">识图提取文字</button>
            <span id="ocrTip"></span>
        </div>
    </div>

    <div class="section no-print">
        <div class="section-title">第二步：风险核验问卷（手动选择）</div>
        <div id="questionWrap"></div>
    </div>

    <div class="section no-print">
        <button class="btn btn-success" id="buildReportBtn">生成简易风险报告</button>
    </div>

    <div id="resultWrap" class="no-print"></div>

    <div id="reportArea" class="report-hidden">
        <div class="section">
            <div class="section-title">📄简易风险评估报告</div>
            <div id="reportContent"></div>
            <div style="margin-top:24px;color:#666;font-size:13px;border-top:1px solid #eee;padding-top:16px;">
                <strong>免责声明：</strong>本评估结果仅作为学生实习风险自查参考，不具备法律效应。
            </div>
        </div>
        <div class="no-print" style="text-align:center;margin-bottom:30px;">
            <button class="btn btn-primary" id="exportPdfBtn">打印 / 保存为PDF</button>
        </div>
    </div>
</div>

<script>
const riskMeta = [
    {title:"收费/押金要求",tip:"收费类实习存在诈骗风险，正规实习不得向学生收取任何费用",suggest:"拒绝缴纳任何费用，更换实习单位"},
    {title:"高额提成保底陷阱",tip:"薪资完全依靠提成无基础保障，谨防口头高薪骗局",suggest:"务必确认书面底薪与薪资构成，拒绝仅口头承诺高薪"},
    {title:"异地外派风险",tip:"无正规办公地点的异地外派存在人身安全隐患",suggest:"核实企业资质、办公地址，谨慎前往异地"},
    {title:"身份证件扣押",tip:"用人单位不允许扣押学生身份证、银行卡原件",suggest:"拒绝上交证件原件，仅可提供复印件并做好签注"},
    {title:"借贷刷单任务",tip:"刷单、垫资转账属于典型电信诈骗模式",suggest:"直接放弃该实习岗位，切勿参与资金操作"},
    {title:"传销层级计酬",tip:"报酬依靠拉人头发展下线获取收益",suggest:"立即放弃该实习，必要时报警"},
    {title:"空白合同签署",tip:"签署空白文件会造成权益完全不受保护",suggest:"拒绝签署任何空白合同与空白文件"},
    {title:"竞业无限扩大",tip:"宽泛无边界竞业协议会限制后续就业",suggest:"协商修改竞业范围、期限与补偿金条款"},
    {title:"敏感信息采集",tip:"在未说明必要性、用途、保存期限和保护措施的前提下强制采集隐私信息存在泄露风险",suggest:"拒绝非必要且无书面说明的敏感信息采集要求"},
    {title:"空白文件与放弃权益",tip:"签署空白文件或主动放弃实习报酬、实习证明等法定基本权益，自身权益将不受保护",suggest:"绝不签署空白文件，不放弃书面明确的实习权益"},
    {title:"不对等协议责任",tip:"协议设置明显不对等的高额违约责任、过度竞业限制、无限期绑定或者企业单方免责条款",suggest:"和企业协商修改权责不对等的违约与约束条款"},
    {title:"无偿加班强制要求",tip:"强制无偿加班侵害学生实习权益",suggest:"和HR确认加班补偿方式，留存沟通记录"},
    {title:"违规高强度夜班",tip:"学生/未成年人长期高危夜班存在安全风险",suggest:"拒绝高危夜班岗位"},
    {title:"隔离核验与紧迫施压",tip:"对方阻止你向家人、学校或官方渠道核实信息，同时催促你立刻付款、提交敏感材料或仓促做决定",suggest:"放缓签约节奏，通过官方渠道核验企业信息，拒绝仓促操作"},
    {title:"变相收费扣款",tip:"以罚款、扣费变相收取实习相关费用",suggest:"拒绝各类变相扣费规则"},
    {title:"外包转嫁用工责任",tip:"签约主体与实际用工不一致，责任容易互相推诿",suggest:"明确实际用工方、签约方各自权责"},
    {title:"疑似深伪身份",tip:"面试身份无法通过企业官方渠道核验，同时出现画面/声音异常，或要求采集和招聘无关的人脸、声纹身份材料",suggest:"通过企业公开官网、官方电话核验招聘人员真实身份"}
];

const hRawList = riskMeta.map((item)=>{
    return {title:item.title, desc:item.tip};
});

let formData = {
    jobText:"",
    hRule:[]
};

function resetAllData(){
    formData.hRule = hRawList.map(item=>({...item,ans:"u"}));
    document.getElementById("resultWrap").innerHTML = "";
    document.getElementById("reportArea").classList.add("report-hidden");
    renderQuestion();
}

function renderQuestion(){
    const wrap = document.getElementById("questionWrap");
    wrap.innerHTML = "";
    hRawList.forEach((item)=>{
        const row = document.createElement("div");
        row.className = "question-row";
        row.innerHTML = `
            <div><strong>${item.title}</strong></div>
            <div style="font-size:13px;color:#666;margin:4px 0 8px;">${item.desc}</div>
            <div class="opt-group">
                <label><input type="radio" name="h_${item.title}" value="y"> 是</label>
                <label><input type="radio" name="h_${item.title}" value="n"> 否</label>
                <label><input type="radio" name="h_${item.title}" value="u" checked> 不确定</label>
            </div>
        `;
        wrap.appendChild(row);
    });
}

function readQuestionValue(){
    hRawList.forEach((item)=>{
        const sel = document.querySelector(`input[name="h_${item.title}"]:checked`);
        item.ans = sel ? sel.value : "u";
    });
}

function calcRiskResult(){
    readQuestionValue();

    const yesList = [];
    const unsureList = [];

    for(let i = 0; i < formData.hRule.length; i++){
        if(formData.hRule[i].ans === "y"){
            yesList.push(riskMeta[i]);
        }
        if(formData.hRule[i].ans === "u"){
            unsureList.push(riskMeta[i]);
        }
    }

    // 第一优先级：只要有任意一项选“是”，直接红色风险
    if(yesList.length > 0){
        let text = "🔴 高危风险\n\n";
        text += "以下风险核验项选择【是】，存在明确高风险，不建议参与本次实习：\n";

        yesList.forEach(h=>{
            text += `\n——————————\n`;
            text += `【风险项】${h.title}\n`;
            text += `【风险说明】${h.tip}\n`;
            text += `【行动建议】${h.suggest}\n`;
        });

        return {level:"red", text};
    }

    // 第二优先级：没有“是”，但有“不确定”，黄色风险
    if(unsureList.length > 0){
        let text = "🟡 信息待核验\n\n";
        text += "以下风险核验项选择【不确定】，建议进一步向企业核实：\n";

        unsureList.forEach(u=>{
            text += `\n——————————\n`;
            text += `【待核验项】${u.title}\n`;
            text += `【说明】${u.tip}\n`;
            text += `【建议】${u.suggest}\n`;
        });

        return {level:"orange", text};
    }

    // 第三优先级：全部选“否”，绿色通过
    return {
        level:"green",
        text:"🟢 暂未发现明确高风险信号\n\n全部风险项均选择【否】。建议完善实习约定信息，留存书面凭证保护自身权益。"
    };
}

document.getElementById("buildReportBtn").onclick = function(){
    formData.jobText = document.getElementById("jobText").value.trim();

    const res = calcRiskResult();
    const wrap = document.getElementById("resultWrap");
    wrap.innerHTML = `<div class="result-block ${res.level}">${res.text}</div>`;

    let reportHtml = "<h4>风险核验详情</h4>";

    formData.hRule.forEach((item)=>{
        const ansText = item.ans === "y" ? "是" : item.ans === "n" ? "否" : "不确定";
        reportHtml += `<div class="report-item"><strong>${item.title}</strong>｜判定结果：${ansText}</div>`;
    });

    document.getElementById("reportContent").innerHTML = reportHtml;
    document.getElementById("reportArea").classList.remove("report-hidden");
};

document.getElementById("exportPdfBtn").onclick = ()=>window.print();

const ocrFile = document.getElementById("ocrFile");
const ocrBtn = document.getElementById("ocrBtn");
const ocrTip = document.getElementById("ocrTip");

ocrBtn.onclick = async function(){
    const file = ocrFile.files[0];
    if(!file){
        alert("请先选择一张岗位截图图片");
        return;
    }

    ocrTip.innerText = "识别加载中，请稍候（超时15秒）";

    try{
        const worker = await Tesseract.createWorker("chi_sim");
        const ret = await worker.recognize(file);
        document.getElementById("jobText").value = ret.data.text;
        ocrTip.innerText = "识别完成";
        await worker.terminate();
    }catch(e){
        ocrTip.innerText = "识别失败，请手动输入文字";
    }
};

resetAllData();
</script>
</body>
</html>
