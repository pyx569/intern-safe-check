<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷录入｜实习有约</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei";}
        body{padding:40px 20px;}
        .container{max-width:800px;margin:0 auto;}
        .box{margin-bottom:16px;}
        input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;}
        .btn{padding:8px 16px;background:#1677ff;color:#fff;border:none;border-radius:6px;cursor:pointer;}
    </style>
</head>
<body>
<div class="container">
    <h1>快捷录入岗位信息</h1>
    <div class="box">
        <label>企业全称</label>
        <input id="quickCompany">
    </div>
    <div class="box">
        <label>实习岗位名称</label>
        <input id="quickPost">
    </div>
    <div class="box">
        <label>岗位完整描述</label>
        <textarea id="quickText" rows="8"></textarea>
    </div>
    <button class="btn" id="goMain">前往风险评估页面填充内容</button>
    <div style="margin-top:12px;"><a href=" ">返回首页</a ></div>
</div>
<script>
document.getElementById("goMain").onclick = function(){
    const data = {
        companyName:document.getElementById("quickCompany").value,
        postName:document.getElementById("quickPost").value,
        jobText:document.getElementById("quickText").value
    }
    sessionStorage.setItem("quickFill",JSON.stringify(data));
    window.location.href="index.html";
}
//index.html补充读取sessionStorage回填逻辑，已预留兼容入口
</script>
</body>
</html>
