<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工作台｜实习有约</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei";}
        body{padding:40px 20px;background:#fff;}
        .container{max-width:1000px;margin:0 auto;}
        .back-bar{display:flex;justify-content:space-between;margin-bottom:24px;align-items:center;}
        .item-card{border:1px solid #eee;padding:16px;border-radius:8px;margin-bottom:12px;}
        .btn{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;margin:0 4px;}
        .btn-blue{background:#1677ff;color:#fff;}
        .btn-red{background:#ff4d4f;color:#fff;}
    </style>
</head>
<body>
<div class="container">
    <div class="back-bar">
        <h1>我的评估历史记录</h1>
        <a href=" "><button class="btn btn-blue">新建评估</button></a >
    </div>
    <div id="recordList"></div>
</div>
<script>
function renderList(){
    const wrap = document.getElementById("recordList");
    const arr = JSON.parse(localStorage.getItem("internRecord")||"[]");
    if(arr.length ===0){
        wrap.innerHTML = "<p>暂无保存的评估记录，点击新建评估开始使用</p >";
        return;
    }
    wrap.innerHTML = "";
    arr.forEach((item,idx)=>{
        const div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
        <h4>${item.companyName || "未命名企业"} - ${item.postName || "未填写岗位"}</h4>
        <p>保存时间：${item.time}</p >
        <div style="margin-top:8px;">
            <button class="btn btn-blue openBtn" data-idx="${idx}">载入评估</button>
            <button class="btn btn-red delBtn" data-id="${item.id}">删除本条</button>
        </div>`;
        wrap.appendChild(div);
    })
    //载入逻辑（localStorage传递给index页面）
    document.querySelectorAll(".openBtn").forEach(btn=>{
        btn.onclick = function(){
            const i = Number(this.dataset.idx);
            const all = JSON.parse(localStorage.getItem("internRecord"));
            sessionStorage.setItem("tempEditData",JSON.stringify(all[i]));
            window.location.href = "index.html";
        }
    })
    //删除逻辑
    document.querySelectorAll(".delBtn").forEach(btn=>{
        btn.onclick = function(){
            const delId = Number(this.dataset.id);
            let list = JSON.parse(localStorage.getItem("internRecord"));
            list = list.filter(x=>x.id !== delId);
            localStorage.setItem("internRecord",JSON.stringify(list));
            renderList();
        }
    })
}
renderList();
</script>
</body>
</html>
