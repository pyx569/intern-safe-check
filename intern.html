<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工作台｜实习有约</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
        body { padding:40px 30px; max-width:1100px; margin:0 auto; background:#f5f7fa; }
        .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; gap:12px; }
        h1 { font-size:28px; color:#222; }
        .btn { border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-size:15px; }
        .btn-blue { background:#1677ff; color:#fff; }
        .btn-gray { background:#94a3b8; color:#fff; }
        .btn-red { background:#ff4d4f; color:#fff; }
        .empty-tip { text-align:center; color:#888; padding:60px 0; font-size:16px; line-height:2; }
        .record-card { background:#fff; border:1px solid #e8e8e8; border-radius:10px; padding:20px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
        .record-title { font-size:17px; font-weight:bold; color:#222; margin-bottom:6px; }
        .record-meta { font-size:13px; color:#888; margin-bottom:10px; }
        .record-actions { display:flex; gap:10px; margin-top:14px; }
        .summary-row { display:flex; gap:24px; margin-top:6px; font-size:13px; color:#555; }
        .tag { display:inline-block; padding:3px 10px; border-radius:4px; font-size:12px; margin-right:8px; font-weight:normal; }
        .tag-red { background:#fff1f0; color:#cf1322; }
        .tag-yellow { background:#fffbe6; color:#d48806; }
        .tag-green { background:#f6ffed; color:#389e0d; }
    </style>
</head>
<body>
    <div class="header-row">
        <h1>我的工作台</h1>
        <div style="display:flex;gap:10px;">
            <button class="btn btn-gray" onclick="window.location.href='fill.html'">快捷录入</button>
            <button class="btn btn-blue" onclick="window.location.href='index.html'">新建评估</button>
        </div>
    </div>
    <div id="listWrap"></div>

<script>
const data = JSON.parse(localStorage.getItem("internRecord")||"[]");
const wrap = document.getElementById("listWrap");

if(data.length === 0){
    wrap.innerHTML = '<div class="empty-tip">暂无保存的评估记录<br>点击右上角「新建评估」或「快捷录入」开始使用</div>';
}else{
    wrap.innerHTML = "";
    data.forEach((item,idx)=>{
        let yesCount = 0, unknownCount = 0;
        if(item.hRule){
            item.hRule.forEach(h=>{
                if(h.ans === "y") yesCount++;
                if(h.ans === "u") unknownCount++;
            });
        }
        let riskTag = "";
        if(yesCount > 0) riskTag = '<span class="tag tag-red">高风险</span>';
        else if(unknownCount > 0) riskTag = '<span class="tag tag-yellow">待核验</span>';
        else riskTag = '<span class="tag tag-green">暂未发现风险</span>';

        const div = document.createElement("div");
        div.className = "record-card";
        div.innerHTML = `
            <div class="record-title">${riskTag}${item.companyName||"未填写企业"} — ${item.postName||"未填写岗位"}</div>
            <div class="record-meta">生成时间：${item.time}</div>
            <div class="summary-row">
                <span>已确认高风险项：${yesCount}</span>
                <span>待核验项：${unknownCount}</span>
            </div>
            <div class="record-actions">
                <button class="btn btn-blue" onclick="loadRecord(${idx})">查看详情</button>
                <button class="btn btn-red" onclick="deleteRecord(${idx})">删除记录</button>
            </div>
        `;
        wrap.appendChild(div);
    });
}

function loadRecord(idx){
    const list = JSON.parse(localStorage.getItem("internRecord")||"[]");
    sessionStorage.setItem("loadRecordData", JSON.stringify(list[idx]));
    window.location.href = "index.html";
}

function deleteRecord(idx){
    if(!confirm("确定删除这条评估记录吗？")) return;
    let list = JSON.parse(localStorage.getItem("internRecord")||"[]");
    list.splice(idx,1);
    localStorage.setItem("internRecord", JSON.stringify(list));
    location.reload();
}
</script>
</body>
</html>
