<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工作台｜实习有约</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
        body { padding:40px 30px; max-width:1100px; margin:0 auto; background:#f5f7fa; }
        .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; gap:12px; flex-wrap:wrap; }
        h1 { font-size:28px; color:#222; }
        .btn { border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-size:15px; }
        .btn-blue { background:#1677ff; color:#fff; }
        .btn-gray { background:#94a3b8; color:#fff; }
        .btn-red { background:#ff4d4f; color:#fff; }
        .btn-orange { background:#fa8c16;color:#fff; }
        .empty-tip { text-align:center; color:#888; padding:40px 0; font-size:16px; line-height:2; }
        .record-card { background:#fff; border:1px solid #e8e8e8; border-radius:10px; padding:20px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,0.04);display:flex;gap:12px;align-items:flex-start; }
        .record-content {flex:1;}
        .record-title { font-size:17px; font-weight:bold; color:#222; margin-bottom:6px; }
        .record-meta { font-size:13px; color:#888; margin-bottom:10px; }
        .record-actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
        .summary-row { display:flex; gap:24px; margin-top:6px; font-size:13px; color:#555; flex-wrap:wrap; }
        .tag { display:inline-block; padding:3px 10px; border-radius:4px; font-size:12px; margin-right:8px; font-weight:normal; }
        .tag-red { background:#fff1f0; color:#cf1322; }
        .tag-yellow { background:#fffbe6; color:#d48806; }
        .tag-green { background:#f6ffed; color:#389e0d; }
        .block-title{font-size:20px;margin:30px 0 16px 0;color:#222;border-left:4px solid #1677ff;padding-left:10px;}
        .log-desc{font-size:14px;color:#444;margin:8px 0;white-space:pre-line;}
        .batch-bar{background:#fff;padding:14px 20px;border-radius:10px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
    </style>
</head>
<body>
    <div class="header-row">
        <h1>我的工作台</h1>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-orange" onclick="openLogModal()">新增打卡日志</button>
            <button class="btn btn-gray" onclick="window.location.href='fill.html'">快捷录入</button>
            <button class="btn btn-blue" onclick="window.location.href='index.html'">返回评估主页</button>
        </div>
    </div>

    <div class="block-title">实习风险评估记录</div>
    <div class="batch-bar">
        <label><input type="checkbox" id="checkAllReport">全选评估记录</label>
        <button class="btn btn-red" onclick="batchDelReport()">批量删除选中评估</button>
    </div>
    <div id="reportWrap"></div>

    <div class="block-title">实习打卡 & 工作日志</div>
    <div class="batch-bar">
        <label><input type="checkbox" id="checkAllLog">全选日志打卡</label>
        <button class="btn btn-red" onclick="batchDelLog()">批量删除选中日志</button>
    </div>
    <div id="logWrap"></div>


    <!-- 新增日志弹窗 -->
    <div id="logModal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;padding:20px;">
        <div style="background:#fff;padding:26px;border-radius:12px;width:100%;max-width:520px;">
            <h3 style="margin-bottom:18px;">新增实习打卡日志</h3>
            <div style="margin-bottom:14px;">
                <label>打卡日期</label>
                <input type="date" id="logDate" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:8px;">
            </div>
            <div style="margin-bottom:14px;">
                <label>当日工作内容</label>
                <textarea id="logContent" rows="6" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:8px;resize:vertical;" placeholder="记录今日完成的工作、收获与问题"></textarea>
            </div>
            <div style="display:flex;gap:12px;margin-top:20px;">
                <button class="btn btn-blue" onclick="saveLog()">保存日志</button>
                <button class="btn btn-gray" onclick="closeLogModal()">取消</button>
            </div>
        </div>
    </div>

<script>
let reportList = JSON.parse(localStorage.getItem("internRecord")||"[]");
const reportWrap = document.getElementById("reportWrap");
function renderReport(){
    reportWrap.innerHTML = "";
    if(reportList.length===0){
        reportWrap.innerHTML = '<div class="empty-tip">暂无保存的评估记录<br>点击右上角「返回评估主页」开始使用</div>';
        return;
    }
    reportList.forEach((item,idx)=>{
        let yesCount = 0, unknownCount = 0;
        if(item.hRule){
            item.hRule.forEach(h=>{
                if(h.ans === "y") yesCount++;
                if(h.ans === "u") unknownCount++;
            });
        }
        let riskTag = "";
        if(yesCount > 0) riskTag = '<span class="tag tag-red">高风险</span>';
        else if(unknownCount > 0) riskTag = '<span class="tag tag-yellow">待核验</span>';
        else riskTag = '<span class="tag tag-green">暂未发现风险</span>';

        const div = document.createElement("div");
        div.className = "record-card";
        div.innerHTML = `
            <input type="checkbox" class="report-checkbox" data-index="${idx}">
            <div class="record-content">
                <div class="record-title">${riskTag}${item.companyName||"未填写企业"} — ${item.postName||"未填写岗位"}</div>
                <div class="record-meta">生成时间：${item.time}</div>
                <div class="summary-row">
                    <span>已确认高风险项：${yesCount}</span>
                    <span>待核验项：${unknownCount}</span>
                </div>
                <div class="record-actions">
                    <button class="btn btn-blue" onclick="loadReport(${idx})">查看详情</button>
                    <button class="btn btn-red" onclick="delReport(${idx})">单条删除</button>
                </div>
            </div>
        `;
        reportWrap.appendChild(div);
    })
}
renderReport();

// 使用URL参数传递记录id，支持新开标签页
function loadReport(idx){
    const rec = reportList[idx];
    window.location.href = "index.html?loadId="+rec.id;
}

function delReport(idx){
    if(!confirm("确定删除这条评估记录吗？"))return;
    reportList.splice(idx,1);
    localStorage.setItem("internRecord",JSON.stringify(reportList));
    renderReport();
}
function batchDelReport(){
    const checks = document.querySelectorAll(".report-checkbox:checked");
    if(checks.length===0){alert("请先勾选需要删除的评估记录");return;}
    if(!confirm(`确定批量删除选中${checks.length}条评估？不可恢复`))return;
    const delIdx = Array.from(checks).map(c=>Number(c.dataset.index)).sort((a,b)=>b-a);
    delIdx.forEach(i=>reportList.splice(i,1));
    localStorage.setItem("internRecord",JSON.stringify(reportList));
    renderReport();
}
document.getElementById("checkAllReport").addEventListener("change",e=>{
    document.querySelectorAll(".report-checkbox").forEach(c=>c.checked = e.target.checked);
})

let logList = JSON.parse(localStorage.getItem("internLog")||"[]");
const logWrap = document.getElementById("logWrap");
function renderLog(){
    logWrap.innerHTML = "";
    if(logList.length===0){
        logWrap.innerHTML = '<div class="empty-tip">暂无实习打卡日志<br>点击「新增打卡日志」填写记录</div>';
        return;
    }
    logList.forEach((item,idx)=>{
        const div = document.createElement("div");
        div.className = "record-card";
        div.innerHTML = `
            <input type="checkbox" class="log-checkbox" data-index="${idx}">
            <div class="record-content">
                <div class="record-title">📅 ${item.logDate}</div>
                <div class="log-desc">${item.logContent}</div>
                <div class="record-actions">
                    <button class="btn btn-red" onclick="delLog(${idx})">单条删除</button>
                </div>
            </div>
        `;
        logWrap.appendChild(div);
    })
}
renderLog();

function openLogModal(){document.getElementById("logModal").style.display="flex";document.getElementById("logDate").valueAsDate=new Date();document.getElementById("logContent").value="";}
function closeLogModal(){document.getElementById("logModal").style.display="none";}
function saveLog(){
    const logDate = document.getElementById("logDate").value.trim();
    const logContent = document.getElementById("logContent").value.trim();
    if(!logDate||!logContent){alert("日期和工作内容不能为空");return;}
    logList.push({logDate,logContent,saveTime:new Date().toLocaleString()});
    localStorage.setItem("internLog",JSON.stringify(logList));
    closeLogModal();
    renderLog();
}
function delLog(idx){
    if(!confirm("删除这条打卡日志？"))return;
    logList.splice(idx,1);
    localStorage.setItem("internLog",JSON.stringify(logList));
    renderLog();
}
function batchDelLog(){
    const checks = document.querySelectorAll(".log-checkbox:checked");
    if(checks.length===0){alert("请先勾选需要删除的日志");return;}
    if(!confirm(`批量删除${checks.length}条打卡日志？不可恢复`))return;
    const delIdx = Array.from(checks).map(c=>Number(c.dataset.index)).sort((a,b)=>b-a);
    delIdx.forEach(i=>logList.splice(i,1));
    localStorage.setItem("internLog",JSON.stringify(logList));
    renderLog();
}
document.getElementById("checkAllLog").addEventListener("change",e=>{
    document.querySelectorAll(".log-checkbox").forEach(c=>c.checked = e.target.checked);
})
</script>
</body>
</html>
